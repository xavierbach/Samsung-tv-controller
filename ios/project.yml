# XcodeGen spec — generates TVRemote.xcodeproj so you never hand-build the
# project. On the Mac:
#
#     brew install xcodegen
#     cd ios && xcodegen generate
#     open TVRemote.xcodeproj
#
# Then set your Team under Signing & Capabilities and hit Run.
name: TVRemote
options:
  bundleIdPrefix: com.xavierbach
  deploymentTarget:
    iOS: "17.0"
targets:
  TVRemote:
    type: application
    platform: iOS
    sources: [TVRemote]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: VWAV65WPK7
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TVRemote/Info.plist
      properties:
        UILaunchScreen: {}   # declares native-resolution support; without it iOS letterboxes
        NSMicrophoneUsageDescription: Hold-to-talk uses the microphone.
        NSSpeechRecognitionUsageDescription: Your commands are transcribed on this device.
        NSLocalNetworkUsageDescription: Talks to the TV server on your home network.
        NSAppTransportSecurity:
          # The server is plain http on a private network (LAN or Tailscale),
          # and ATS blocks cleartext even to raw IPs — with no way to carve
          # out an IP via NSExceptionDomains. So allow cleartext app-wide:
          # acceptable for a sideloaded home app that only talks to its own
          # server. NOTE: do not add NSAllowsLocalNetworking alongside this —
          # on iOS 10+ the granular key would make iOS ignore this one.
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad must support all four orientations unless the app declares
        # full-screen — three alone trips an Xcode warning.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
