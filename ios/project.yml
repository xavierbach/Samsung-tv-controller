# XcodeGen spec — generates TVRemote.xcodeproj so you never hand-build the
# project. On the Mac:
#
#     brew install xcodegen
#     cd ios && xcodegen generate
#     open TVRemote.xcodeproj
#
# Then set your Team under Signing & Capabilities and hit Run.
name: TVRemote
options:
  bundleIdPrefix: com.xavierbach
  deploymentTarget:
    iOS: "17.0"
targets:
  TVRemote:
    type: application
    platform: iOS
    sources: [TVRemote]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: VWAV65WPK7
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TVRemote/Info.plist
      properties:
        UILaunchScreen: {}   # declares native-resolution support; without it iOS letterboxes
        NSMicrophoneUsageDescription: Hold-to-talk uses the microphone.
        NSSpeechRecognitionUsageDescription: Your commands are transcribed on this device.
        NSLocalNetworkUsageDescription: Talks to the TV server on your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # The server is plain http. ATS already lets raw IPs through, but
          # blocks http to real hostnames — this allows Tailscale MagicDNS
          # names (xxx.tailXXXX.ts.net) so the app works away from home.
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
