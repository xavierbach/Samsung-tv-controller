[project]
name = "samsung-tv-controller"
version = "0.1.0"
description = "Natural-language super controller for all the Samsung TVs in your house"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116.0",
    "samsungtvws[async,encrypted]>=2.6.0",
    "wakeonlan>=3.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
appletv = ["pyatv>=0.16"]

[project.scripts]
tvctl = "tv_controller.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
